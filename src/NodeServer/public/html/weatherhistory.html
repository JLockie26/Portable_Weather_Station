<section>
    <h2>Weather History & Records</h2>
        <section class="displayContent formSection">
        <form id="requestForm" class="formGrid">
            <div>
                <label for="weatherType">Measurement(s):</label><br>
                <select id="weatherType" name="weatherType" required>
                    <option value="temp">Temperature</option>
                    <option value="humid">Humidity</option>
                    <option value="press">Air Pressure</option>
                </select>
            </div>

            <div>
                <label for="startMonth">Start Date:</label><br>
                <select id="startMonth" name="startMonth" required>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <div>
                <label for="endMonth">End Date:</label><br>
                <select id="endMonth" name="endMonth" required>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <div>
                <label for="year">Year:</label><br>
                <select id="year" name="year" required>
                    <option value="2007">2007</option>
                    <option value="2008">2008</option>
                    <option value="2009">2009</option>
                    <option value="2010">2010</option>
                    <option value="2011">2011</option>
                    <option value="2012">2012</option>
                    <option value="2013">2013</option>
                    <option value="2014">2014</option>
                    <option value="2015">2015</option>
                    <option value="2016">2016</option>
                </select>
            </div>

            <div>
                <label for="outputType">Output Type:</label><br>
                <select id="outputType" name="outputType" required>
                    <option value="table">Table</option>
                    <option value="graph">Graph</option>
                    <option value="both">Both</option>
                </select>
            </div>

            <div>
                <label for="interpolate">Interpolate:</label><br>
                <input type="checkbox" id="interpolate" name="interpolate" value="true"><br>
                <input type="hidden" name="interpolate" value="false">
            </div>    
            
            <div class="buttonGroup">
                <input id="submit" type="submit" value="Submit">
                <input id="reset" type="reset" value="Clear">
            </div>
        </form>
    </section>
    <section class="displayContent resultsSection">
    <p id="responseArea">Basic Form to get a feel for what this page will look like. Currently non-functional</p>
        <section class="tableSection">
            <table class="weatherTable">

            </table>
        </section>

        <section class="weatherGraph">
            <div id="weatherGraph">

            </div>
        </section>
    </section>
</section>
