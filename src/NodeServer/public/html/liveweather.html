<section>
    <h2>Live Weather Data</h2>

    <div class="liveDisplayGrid">
        <section class="displayContent tempSection liveStat">
            <div class="statGrid">
                <h3 class="statName">Temperature</h3>
                <img class="statIcon" src="../img/thermometer.png" alt="thermometer icon">
                <h1 class="statValue" id="tempStat">default</h1>
            </div>
        </section>

        <section class="displayContent humidSection liveStat">
            <div class="statGrid">
                <h3 class="statName">Humidity</h3>
                <img class="statIcon" src="../img/humidity.png" alt="humidity icon">
                <h1 class="statValue" id="humidStat">default</h1>
            </div>
        </section>

        <section class="displayContent pressSection liveStat">
            <div class="statGrid">
                <h3 class="statName">Barometric Pressure</h3>
                <img class="statIcon" src="../img/air.png" alt="air pressure icon">
                <h1 class="statValue" id="pressStat">default</h1>
            </div>
        </section>
    </div>

    <section class="displayContent settingsSection">
        
    </section>

</section>
